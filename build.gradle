import org.gradle.api.plugins.jvm.JvmTestSuite

plugins {
    id 'application'
    id 'jvm-test-suite'
    id 'maven-publish'
    alias libs.plugins.gradleutils
    alias libs.plugins.gitversion
    alias libs.plugins.changelog
}

gradleutils.displayName = 'Maven-Version'
description = 'A library for comparing Maven Versions, Standalone distribution of the version part of org.apache.maven:maven-artifact, with JPMS compatibility'
group = 'net.minecraftforge'
version = gitversion.version

println "Version: $version"

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

application {
    mainModule = 'net.minecraftforge.maven.version'
    mainClass = 'net.minecraftforge.maven.version.ComparableVersion'
}

jar {
    manifest {
        attributes('Main-Class': 'net.minecraftforge.maven.version.ComparableVersion')
    }
}

tasks.named('compileJava', JavaCompile) {
    // Gradle doesn't automatically set the modular version, we have to
    options.javaModuleVersion = provider { version }
}

testing {
    suites.named('test', JvmTestSuite) {
        useJUnitJupiter(libs.versions.junit)

        dependencies {
            implementation libs.junit.api
            runtimeOnly.bundle libs.bundles.junit.runtime
        }
    }
}

repositories {
    mavenCentral()
}

changelog {
    fromBase()
}

publishing {
    repositories {
        maven gradleutils.publishingForgeMaven
    }

    publications.register('mavenJava', MavenPublication) {
        changelog.publish(it)
        gradleutils.promote(it)

        suppressAllPomMetadataWarnings()
        from components.java

        pom {
            name = 'maven-version'
            description = project.description
            url = 'https://github.com/MinecraftForge/maven-version'

            gradleutils.pom.addRemoteDetails(pom)

            license gradleutils.pom.licenses.Apache2_0
        }
    }
}
